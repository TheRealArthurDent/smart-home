###############################################################################
#                            SERVICE INPUT PLUGINS                            #
###############################################################################


# Read metrics from MQTT topic(s)
# [[inputs.mqtt_consumer]]
#     name_suffix = "_connection_status"
#     servers = ["tcp://mosquitto:1883"]
#     ## MQTT QoS, must be 0, 1, or 2
#     qos = 0
#
#     ## Topics to subscribe to
#     topics = [
#         "subscribers/+/connection-status",
#     ]
#
#     # if true, messages that can't be delivered while the subscriber is offline
#     # will be delivered when it comes back (such as on service restart).
#     # NOTE: if true, client_id MUST be set
#     persistent_session = false
#     # If empty, a random client ID will be generated.
#     client_id = ""
#
#     ## username and password to connect MQTT server.
#     username = "mosquitto"
#     password = "$MOSQUITTO_PASSWD"
#
#     ## Optional SSL Config
#     # ssl_ca = "/etc/telegraf/ca.pem"
#     # ssl_cert = "/etc/telegraf/cert.pem"
#     # ssl_key = "/etc/telegraf/key.pem"
#     ## Use SSL but skip chain & host verification
#     # insecure_skip_verify = false
#
#     ## Data format to consume.
#     ## Each data format has it's own unique set of configuration options, read
#     ## more about them here:
#     ## https://github.com/influxdata/telegraf/blob/master/docs/DATA_FORMATS_INPUT.md
#     data_format = "value"
#     data_type = "string"

[[inputs.mqtt_consumer]]
    name_override = "mqtt_client_connection_status"
    servers = ["tcp://mosquitto:1883"]
    ## MQTT QoS, must be 0, 1, or 2
    qos = 0

    ## Topics to subscribe to
    topics = [
        "subscribers/+/connection-status",
    ]

    # if true, messages that can't be delivered while the subscriber is offline
    # will be delivered when it comes back (such as on service restart).
    # NOTE: if true, client_id MUST be set
    persistent_session = false
    # If empty, a random client ID will be generated.
    client_id = ""

    ## username and password to connect MQTT server.
    username = "mosquitto"
    password = "$MOSQUITTO_PASSWD"

    ## Optional SSL Config
    # ssl_ca = "/etc/telegraf/ca.pem"
    # ssl_cert = "/etc/telegraf/cert.pem"
    # ssl_key = "/etc/telegraf/key.pem"
    ## Use SSL but skip chain & host verification
    # insecure_skip_verify = false

    data_format = "value"
    data_type = "string"

    [[inputs.mqtt_consumer.topic_parsing]]
        #topic_tag = ""
        topic = "subscribers/+/connection-status"
        measurement = "measurement/_/_"
        tags = "_/client/_"

[[processors.enum]]
    namepass = ["mqtt_client_connection_status"]
    [[processors.enum.mapping]]
        field = "value"
        default = -1

        [processors.enum.mapping.value_mappings]
          CONNECTED = 1
          Connected = 1
          connected = 1
          DISCONNECTED = 0
          Disconnected = 0
          disconnected = 0
