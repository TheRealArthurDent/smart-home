# config file version
apiVersion: 1

# List of rule groups to import or update
groups:
  # <int> organization ID, default = 1
  - orgId: 1
    # <string, required> name of the rule group
    name: Host
    # <string, required> name of the folder the rule group will be stored in
    folder: General Alerting
    # <duration, required> interval that the rule group should evaluated at
    interval: 5m
    # <list, required> list of rules that are part of the rule group
    rules:
      # <string, required> unique identifier for the rule
      - uid: host_disc_free_space
        # <string, required> title of the rule that will be displayed in the UI
        allowUiUpdates: true
        title: Host disc free space
        # <string, required> which query should be used for the condition
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: InfluxDB
            model:
              datasource:
                type: influxdb
                uid: InfluxDB
              groupBy:
                - params:
                    - $__interval
                  type: time
                - params:
                    - "null"
                  type: fill
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              measurement: disk
              orderByTime: ASC
              policy: default
              refId: A
              resultFormat: time_series
              select:
                - - params:
                      - free
                    type: field
                  - params: []
                    type: mean
                  - params:
                      - ' / 1073741824'
                    type: math
              tags: []
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 50
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: ""
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: disc-space
        panelId: 2
        noDataState: NoData
        execErrState: Alerting
        for: 15m
        annotations:
          __dashboardUid__: disc-space
          __panelId__: "2"
          summary: Free disc space has dropped below 50 GB.
        labels: {}
        isPaused: false
