# config file version
apiVersion: 1

# List of rule groups to import or update
groups:
  # <int> organization ID, default = 1
  - orgId: 1
    # <string, required> name of the rule group
    name: Sensors
    # <string, required> name of the folder the rule group will be stored in
    folder: Alerting Sensors
    # <duration, required> interval that the rule group should evaluated at
    interval: 1h
    # <list, required> list of rules that are part of the rule group
    rules:
      # <string, required> unique identifier for the rule

        ### Temp, Humidity and pressure sensors
        # Livingroom
      - uid: sensor_temp_livingroom_unreacheable
        title: Temp sensor livingroom unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 259200
              to: 0
            datasourceUid: InfluxDB
            model:
              adhocFilters: [ ]
              alias: ""
              datasource:
                type: influxdb
                uid: InfluxDB
              groupBy:
                - params:
                    - $__interval
                  type: time
                - params:
                    - "null"
                  type: fill
              intervalMs: 86400000
              limit: ""
              maxDataPoints: 1
              measurement: sensors.0.livingroom.reachable
              orderByTime: ASC
              policy: default
              rawQuery: false
              rawSql: ""
              refId: A
              resultFormat: time_series
              select:
                - - params:
                      - value
                    type: field
                  - params: [ ]
                    type: last
              slimit: ""
              tags: [ ]
              tz: ""
          - refId: B
            relativeTimeRange:
              from: 259200
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [ ]
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: [ ]
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 86400000
              maxDataPoints: 1
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 259200
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: within_range
                  operator:
                    type: and
                  query:
                    params:
                      - D
                  reducer:
                    params: [ ]
                    type: last
                  type: query
                  unloadEvaluator:
                    params:
                      - 0
                      - 0
                    type: outside_range
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 86400000
              maxDataPoints: 1
              refId: C
              type: threshold
        dashboardUid: battery-levels
        panelId: 11
        noDataState: NoData
        execErrState: Error
        for: 1h
        annotations:
          __dashboardUid__: battery-levels
          __panelId__: "11"
          summary: 🌡️ The temperature sensor "Livingroom" is unreachable.
        labels: { }
        isPaused: false

