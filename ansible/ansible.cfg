[defaults]
inventory = inventory/hosts.yaml
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Accept the host key of a host we've never seen, but refuse a changed key (same as raspberry).
# The first three options are Ansible's defaults, which ssh_args replaces.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
