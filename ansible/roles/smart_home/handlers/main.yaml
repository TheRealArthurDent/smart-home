---
# Compose recreates a container whose definition changed; these cover the config files mounted into one.
- name: Restart mosquitto
  community.docker.docker_compose_v2:
    project_src: "{{ smart_home_compose_dir }}"
    project_name: "{{ smart_home_project_name }}"
    env_files:
      - "{{ smart_home_env_file }}"
    services:
      - mosquitto
    state: restarted
  # Like "Ensure the stack is up": in check mode, a first run hasn't written the compose project yet.
  when:
    - smart_home_manage_containers | bool
    - not (ansible_check_mode and smart_home_compose_file is changed)

- name: Restart telegraf
  community.docker.docker_compose_v2:
    project_src: "{{ smart_home_compose_dir }}"
    project_name: "{{ smart_home_project_name }}"
    env_files:
      - "{{ smart_home_env_file }}"
    services:
      - telegraf
    state: restarted
  # Like "Ensure the stack is up": in check mode, a first run hasn't written the compose project yet.
  when:
    - smart_home_manage_containers | bool
    - not (ansible_check_mode and smart_home_compose_file is changed)

- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: "{{ smart_home_compose_dir }}"
    project_name: "{{ smart_home_project_name }}"
    env_files:
      - "{{ smart_home_env_file }}"
    services:
      - grafana
    state: restarted
  # Like "Ensure the stack is up": in check mode, a first run hasn't written the compose project yet.
  when:
    - smart_home_manage_containers | bool
    - not (ansible_check_mode and smart_home_compose_file is changed)
