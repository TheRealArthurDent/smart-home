# Same hosts as raspberry's inventory; raspberry's bootstrap.yaml must have run on a host first.
all:
  hosts:
    raspi:
      ansible_host: 192.168.1.2
      ansible_port: 1357
      ansible_user: smarthome
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_become: true
    testbed:
      ansible_host: 192.168.1.7
      ansible_port: 4242
      ansible_user: testuser
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_become: true
