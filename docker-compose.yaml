version: '3.7'
services:
  # iobroker
  iobroker:
    hostname: iobroker
    container_name: iobroker
    image: buanet/iobroker:v10.0.0
    restart: unless-stopped
    volumes:
      - iobroker-storage:/opt/iobroker
      - ./setup/iobroker/userscript_firststart.sh:/opt/userscripts/userscript_firststart.sh
    env_file:
      - /etc/docker/smart-home/.env
    environment:
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_EMAIL=${GITHUB_EMAIL}
    networks:
      - siz # accessibility by nginx
      - smart-home # influxdb, mqtt
      - outbound # internet
    dns:
      - 172.30.1.153
  # redis-overcommit-on-host - solves https://github.com/jemalloc/jemalloc/issues/1328
  redis-overcommit:
    container_name: redis-overcommit
    build:
      context: https://github.com/bkuhl/redis-overcommit-on-host.git
    restart: "no"
    privileged: true
    volumes:
      - /proc/sys/vm:/mnt/vm
  iobroker-states-redis:
    hostname: iobroker-states-redis
    container_name: iobroker-states-redis
    image: redis:7.4.0-alpine
    restart: unless-stopped
    depends_on:
      - redis-overcommit
    env_file:
      - /etc/docker/smart-home/.env
    command: redis-server --save 300 1 --loglevel warning --port ${IOBROKER_STATES_REDIS_PORT}
    volumes:
      - iobroker-states-redis-storage:/data
    networks:
      - smart-home
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${IOBROKER_STATES_REDIS_PORT}", "--raw", "incr", "ping" ]
  iobroker-objects-redis:
    hostname: iobroker-objects-redis
    container_name: iobroker-objects-redis
    image: redis:7.4.0-alpine
    restart: unless-stopped
    depends_on:
      - redis-overcommit
    env_file:
      - /etc/docker/smart-home/.env
    command: redis-server --save 300 1 --loglevel warning --port ${IOBROKER_OBJECTS_REDIS_PORT}
    volumes:
      - iobroker-objects-redis-storage:/data
    networks:
      - smart-home
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${IOBROKER_OBJECTS_REDIS_PORT}", "--raw", "incr", "ping" ]
  # deConz
  deconz:
    hostname: deconz
    container_name: deconz
    image: deconzcommunity/deconz:2.28.1
    restart: unless-stopped
    volumes:
      - deconz-storage:/opt/deCONZ
      - ikea-tradfri-firmware-storage:/opt/deCONZ/otau
    devices:
      - /dev/${DECONZ_DEVICE_TYPE}:/dev/ttyACM0
    env_file:
      - /etc/docker/smart-home/.env
    environment:
      - TZ='Europe/Berlin'
      #DECONZ_DEVICE=/dev/ttyACM0
      - DECONZ_WEB_PORT=443
      - DECONZ_WS_PORT=8443
      - DECONZ_VNC_MODE=1
      - DECONZ_VNC_PASSWORD=${DECONZ_VNC_PASSWORD}
      - DEBUG_OTA=1
    networks:
      - siz # accessibility by nginx
      - smart-home # iobroker and node-red access
      - outbound # internet
    dns:
      - 172.30.1.153
    ports:
      - "8088:443" # for f***in stupid hue essentials app
  firmware-download:
    container_name: firmware-download
    build:
      context: ./firmware-download
    restart: unless-stopped
    volumes:
      - ikea-tradfri-firmware-storage:/root/otau
    networks:
      - outbound # internet
    dns:
      - 172.30.1.153
  # influx db
  influxdb:
    container_name: influxdb
    image: influxdb:1.8.10 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=influx
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_READ_USER=read
      - INFLUXDB_READ_USER_PASSWORD=${INFLUXDB_READ_PASSWORD}
      - INFLUXDB_WRITE_USER=write
      - INFLUXDB_WRITE_USER_PASSWORD=${INFLUXDB_READ_PASSWORD}
      - INFLUXDB_MONITOR_STORE_ENABLED=FALSE
    volumes:
      - influxdb-storage:/var/lib/influxdb
    networks:
      - smart-home
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8086/ping" ]
  # chronograf (influx admin ui)
  #chronograf:
  #  hostname: chronograf
  #  container_name: chronograf
  #  image: chronograf:1.10 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
  #  restart: unless-stopped
  #  volumes:
  #    - chronograf-storage:/var/lib/chronograf
  #  depends_on:
  #    - influxdb
  #  environment:
  #    - INFLUXDB_URL=http://influxdb:8086
  #    - INFLUXDB_USERNAME=admin
  #    - INFLUXDB_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
  #  networks:
  #    - siz # accessibility by nginx
  #    - smart-home # influxdb
  # telegraf (export from mqtt to influx)
  telegraf:
    hostname: telegraf
    container_name: telegraf
    image: telegraf:1.31 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    restart: unless-stopped
    volumes:
      - /etc/docker/smart-home/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /etc/docker/smart-home/telegraf/cpu_temp.sh:/usr/local/sbin/cpu_temp.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/rootfs/sys:ro
      - /proc:/rootfs/proc:ro
      - /etc:/rootfs/etc:ro
    user:
      "telegraf:992"
    depends_on:
      - influxdb
    networks:
      - smart-home # influxdb
  # grafana
  grafana:
    hostname: grafana
    container_name: grafana
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/:/etc/grafana/provisioning
      - /etc/docker/smart-home/secrets/:/etc/secrets/:ro
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
      - siz # accessibility by nginx
      - smart-home # get data from influxdb
      - outbound # internet
    dns:
      #- 127.0.0.1
      - 172.30.1.153
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
  # MQTT broker
  mosquitto:
    hostname: mosquitto
    container_name: mqtt
    image: eclipse-mosquitto:2.0.19
    #pull_policy: always
    restart: unless-stopped
    ports:
      - "1883:1883"
      # websockets not needed for the time being - "9001:9001"
    volumes:
      - /etc/docker/smart-home/mosquitto:/mosquitto/config:ro
      - /opt/mosquitto/data:/mosquitto/data
      - /var/log/mosquitto:/mosquitto/log
    networks:
      - default # needed to expose port 1883
      - smart-home
volumes:
  iobroker-storage:
  iobroker-states-redis-storage:
  iobroker-objects-redis-storage:
  influxdb-storage:
  #chronograf-storage:
  grafana-storage:
  deconz-storage:
  ikea-tradfri-firmware-storage:
networks:
  default:
    driver: bridge
  siz:
    name: siz
    external: true
  outbound:
    name: outbound
    external: true
  smart-home:
    name: smart-home
    internal: true
