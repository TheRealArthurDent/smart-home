version: '3'
services:
  # iobroker
  iobroker:
    hostname: iobroker
    container_name: iobroker
    image: buanet/iobroker:v5.1.0
    restart: unless-stopped
    ports:
      - "8081:8081" # UI
      - "8082:8082" # web server
      - "1880:1880" # node-red
    volumes:
      - iobrokerdata:/opt/iobroker
  # influx db
  influxdb:
    image: library/influxdb:1.8-alpine
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=influx
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_READ_USER=grafana
      - INFLUXDB_READ_USER_PASSWORD=${INFLUXDB_GRAFANA_PASSWORD}
      - INFLUXDB_WRITE_USER=iobroker
      - INFLUXDB_WRITE_USER_PASSWORD=${INFLUXDB_IOBROKER_PASSWORD}
    volumes:
      - influxdb-storage:/var/lib/influxdb
  # chronograf (influx admin ui)
  chronograf:
    hostname: chronograf
    container_name: chronograf
    image: library/chronograf:1.8-alpine
    restart: unless-stopped
    ports:
      - '8888:8888'
    volumes:
      - chronograf-storage:/var/lib/chronograf
    depends_on:
      - influxdb
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
  # grafana
  grafana:
    hostname: grafana
    container_name: grafana
    image: grafana/grafana:7.3.6
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/:/etc/grafana/provisioning # TODO
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
  # MQTT broker
  mosquitto:
    hostname: mosquitto
    container_name: mqtt
    image: library/eclipse-mosquitto:1.6
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - /opt/mosquitto/config:/mosquitto/config # TODO move to etc
      - /opt/mosquitto/data:/mosquitto/data
      - /opt/mosquitto/log:/mosquitto/log # /var/log/mosquitto
volumes:
  iobrokerdata:
  influxdb-storage:
  chronograf-storage:
  grafana-storage: