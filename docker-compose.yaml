version: '3.7'
services:
  # iobroker
  iobroker:
    hostname: iobroker
    container_name: iobroker
    image: buanet/iobroker:v8.1.0
    #pull_policy: always
    restart: unless-stopped
    volumes:
      - iobroker-storage:/opt/iobroker
      - ./setup/iobroker/userscript_firststart.sh:/opt/userscripts/userscript_firststart.sh
    networks:
      - siz # accessibility by nginx
      - smart-home # influxdb, mqtt
      - outbound # internet
    dns:
      - 172.30.1.153
  # deConz
  deconz:
    hostname: deconz
    container_name: deconz
    image: deconzcommunity/deconz:2.23.00
    #pull_policy: always
    restart: unless-stopped
    volumes:
      - deconz-storage:/opt/deCONZ
      - ikea-tradfri-firmware-storage:/opt/deCONZ/otau
    env_file:
      - /etc/docker/smart-home/.env
    devices:
      - /dev/${DECONZ_DEVICE_TYPE}:/dev/ttyACM0
    environment:
      - TZ='Europe/Berlin'
      #DECONZ_DEVICE=/dev/ttyACM0
      - DECONZ_WEB_PORT=443
      - DECONZ_WS_PORT=8443
      - DECONZ_VNC_MODE=1
      - DECONZ_VNC_PASSWORD=${DECONZ_VNC_PASSWORD}
      - DEBUG_OTA=1
    networks:
      - siz # accessibility by nginx
      - smart-home # iobroker and node-red access
      - outbound # internet
    dns:
      - 172.30.1.153
    ports:
      - "8088:443" # for f***in stupid hue essentials app
  firmware-download:
    container_name: firmware-download
    build:
      context: ./firmware-download
    restart: unless-stopped
    volumes:
      - ikea-tradfri-firmware-storage:/root/otau
    networks:
      - outbound # internet
    dns:
      - 172.30.1.153
  # influx db
  influxdb:
    container_name: influxdb
    image: influxdb:1.8 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    #pull_policy: always
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=influx
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_READ_USER=read
      - INFLUXDB_READ_USER_PASSWORD=${INFLUXDB_READ_PASSWORD}
      - INFLUXDB_WRITE_USER=write
      - INFLUXDB_WRITE_USER_PASSWORD=${INFLUXDB_READ_PASSWORD}
      - INFLUXDB_MONITOR_STORE_ENABLED=FALSE
    volumes:
      - influxdb-storage:/var/lib/influxdb
    networks:
      - smart-home
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8086/ping" ]
  # chronograf (influx admin ui)
  chronograf:
    hostname: chronograf
    container_name: chronograf
    image: chronograf:1.10 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    #pull_policy: always
    restart: unless-stopped
    volumes:
      - chronograf-storage:/var/lib/chronograf
    depends_on:
      - influxdb
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
    networks:
      - siz # accessibility by nginx
      - smart-home # influxdb
  # telegraf (export from mqtt to influx)
  telegraf:
    hostname: telegraf
    container_name: telegraf
    image: telegraf:1.27 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    #pull_policy: always
    restart: unless-stopped
    volumes:
      - /etc/docker/smart-home/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /etc/docker/smart-home/telegraf/cpu_temp.sh:/usr/local/sbin/cpu_temp.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/rootfs/sys:ro
      - /proc:/rootfs/proc:ro
      - /etc:/rootfs/etc:ro
    depends_on:
      - influxdb
    networks:
      - smart-home # influxdb
  # grafana
  grafana:
    hostname: grafana
    container_name: grafana
    image: grafana/grafana:10.1.0
    #pull_policy: always
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/:/etc/grafana/provisioning
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=natel-discrete-panel
    networks:
      - siz # accessibility by nginx
      - smart-home # get data from influxdb
      - outbound # internet
    dns:
      #- 127.0.0.1
      - 172.30.1.153
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
  # MQTT broker
  mosquitto:
    hostname: mosquitto
    container_name: mqtt
    image: eclipse-mosquitto:2.0.17
    #pull_policy: always
    restart: unless-stopped
    ports:
      - "1883:1883"
      # websockets not needed for the time being - "9001:9001"
    volumes:
      - /etc/docker/smart-home/mosquitto:/mosquitto/config:ro
      - /opt/mosquitto/data:/mosquitto/data
      - /var/log/mosquitto:/mosquitto/log
    networks:
      - default # needed to expose port 1883
      - smart-home
volumes:
  iobroker-storage:
  influxdb-storage:
  chronograf-storage:
  grafana-storage:
  deconz-storage:
  ikea-tradfri-firmware-storage:
networks:
  default:
    driver: bridge
  siz:
    name: siz
    external: true
  outbound:
    name: outbound
    external: true
  smart-home:
    name: smart-home
    internal: true
