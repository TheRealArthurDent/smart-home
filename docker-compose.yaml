version: "3.7"
services:
  # iobroker
  iobroker:
    hostname: iobroker
    container_name: iobroker
    image: buanet/iobroker:v6.0.0
    restart: unless-stopped
    volumes:
      - iobroker-storage:/opt/iobroker
    networks:
      - nginx
      - default
      #- siz
      #- smart-home
  # influx db
  influxdb:
    image: influxdb:1.8 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    container_name: influxdb
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=influx
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_READ_USER=read
      - INFLUXDB_READ_USER_PASSWORD=${INFLUXDB_READ_PASSWORD}
      - INFLUXDB_WRITE_USER=write
      - INFLUXDB_WRITE_USER_PASSWORD=${INFLUXDB_READ_PASSWORD}
    volumes:
      - influxdb-storage:/var/lib/influxdb
    networks:
      - default
      #- smart-home
  # chronograf (influx admin ui)
  chronograf:
    hostname: chronograf
    container_name: chronograf
    image: chronograf:1.9 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    restart: unless-stopped
    volumes:
      - chronograf-storage:/var/lib/chronograf
    depends_on:
      - influxdb
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
    networks:
      - nginx
      - default
      #- siz
      #- smart-home
  # telegraf (export from mqtt to influx)
  telegraf:
    hostname: telegraf
    container_name: telegraf
    image: telegraf:1.21 # -alpine is not available for linux/arm/v7 and therefore not usable on raspi
    restart: unless-stopped
    volumes:
      - /etc/docker/smart-home/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/rootfs/sys:ro
      - /proc:/rootfs/proc:ro
      - /etc:/rootfs/etc:ro
    depends_on:
      - influxdb
    networks:
      - default
      #- smart-home
  # grafana
  grafana:
    hostname: grafana
    container_name: grafana
    image: grafana/grafana:8.3.3
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/:/etc/grafana/provisioning
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=natel-discrete-panel
    networks:
      - nginx
      - default
      #- siz
      #- smart-home
    #dns:
      #- 172.30.2.1
  # MQTT broker
  mosquitto:
    hostname: mosquitto
    container_name: mqtt
    image: eclipse-mosquitto:1.6
    restart: unless-stopped
    ports:
      - "1883:1883"
      # websockets not needed for the time being - "9001:9001"
    volumes:
      - /etc/docker/smart-home/mosquitto:/mosquitto/config
      - /opt/mosquitto/data:/mosquitto/data
      - /var/log/mosquitto:/mosquitto/log
    networks:
      #- smart-home
      - default # needed to expose port 1883
volumes:
  iobroker-storage:
  influxdb-storage:
  chronograf-storage:
  grafana-storage:
networks:
  nginx:
    name: nginx
  default:
    driver: bridge
  #siz:
  #  name: siz
  #  external: true
  #smart-home:
  #  name: smart-home
  #  internal: true