name: Grafana Dashboard Lint

# See: https://docs.github.com/en/free-pro-team@latest/actions/reference/events-that-trigger-workflows
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  repository_dispatch:

env:
  GRAFANA_DASHBOARD_LINTER_VERSION: v0.2.0

jobs:
  lint:
    name: Lint Grafana dashboards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'

      # Cache Go modules to speed up subsequent builds
      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Install dashboard-linter
        shell: bash
        # run: go install github.com/grafana/dashboard-linter@latest
        # does not currently work because go.mod contains a replace directive
        # Go refuses to install a module with replaces.
        # Build from a checkout instead.
        # See https://github.com/grafana/dashboard-linter/blob/main/README.md
        run: |
          VERSION="${{ env.GRAFANA_DASHBOARD_LINTER_VERSION }}"
          VERSION_NO_V="${VERSION#v}"
          URL="https://github.com/grafana/dashboard-linter/releases/download/"
          URL+="${VERSION}/"
          URL+="dashboard-linter_${VERSION_NO_V}_linux_amd64.tar.gz"
          curl -sSfL "$URL" | tar -xz -C /usr/local/bin dashboard-linter
      - name: Rules
        shell: bash
        run: dashboard-linter rules

      - name: Linting
        shell: bash
        run: |
          for FILE in grafana-provisioning/dashboards/provisioned/*.json
          do
            echo "Linting $FILE"
            dashboard-linter lint "$FILE" --strict --verbose;
          done
