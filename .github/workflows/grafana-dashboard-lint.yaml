name: Grafana Dashboard Lint

# See: https://docs.github.com/en/free-pro-team@latest/actions/reference/events-that-trigger-workflows
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  repository_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dashboard-linter
        run: go install github.com/grafana/dashboard-linter@latest

      - name: Rules
        run: dashboard-linter rules

      - name: Linting
        run: |
          for FILE in grafana-provisioning/dashboards/provisioned/*.json
          do
            echo "Linting $FILE"
            dashboard-linter lint "$FILE" --strict --verbose;
          done
