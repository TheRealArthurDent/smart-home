name: Review dog

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    # reviewdog posts its findings as PR review comments; without write access it falls back to log annotations.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spellcheck
        uses: reviewdog/action-misspell@c846b6b0996029d2d39540c8ffebebbd957072db # v1.31.0
        with:
          reporter: github-pr-review
          locale: US
          # cancelled: Home Assistant spells its timer.cancelled event that way
          ignore: mosquitto,cancelled

      - name: Action lint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: github-pr-review

      - name: YAML lint
        uses: reviewdog/action-yamllint@020fba38ce9fed550c704d933aeeb7d6360f7d47 # v1.26.0
        with:
          reporter: github-pr-review

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@584c3e89347d0b16ede47c73ae199550a02b1b37 # v0.33.1
        with:
          reporter: github-pr-review
