name: Review dog

on:
  pull_request:
    branches:
      - main

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Spellcheck
        uses: reviewdog/action-misspell@v1.26.3
        with:
          reporter: github-pr-review
          locale: US
          ignore: mosquitto

      - name: Action lint
        uses: reviewdog/action-actionlint@v1.66.0
        with:
          reporter: github-pr-review

      - name: Docker lint
        uses: reviewdog/action-hadolint@v1.50.2
        with:
          reporter: github-pr-review
          # Ignore https://github.com/hadolint/hadolint/wiki/DL3018
          # and    https://github.com/hadolint/hadolint/wiki/DL3019
          # We want to install wget from alpine's cache,
          # so we can keep the build offline.
          hadolint_ignore: DL3018 DL3019

      - name: YAML lint
        uses: reviewdog/action-yamllint@v1.21.0
        with:
          reporter: github-pr-review

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0.26.2
        with:
          reporter: github-pr-review
