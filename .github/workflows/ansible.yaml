name: Ansible Tests

on:
  # Feature branches are covered by their PR, so pushes only run on main (no duplicate runs).
  push:
    branches:
      - main
  # Every PR, without a paths filter: the main ruleset requires these checks, and a skipped required check
  # would block the merge forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write  # publish test reports as check runs

jobs:
  lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yaml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint --strict

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule tests
        working-directory: ansible
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6.6.1
        with:
          check_name: Molecule test report
          report_paths: test-results/molecule/*.xml
          detailed_summary: true
          include_passed: true

      - name: Upload raw reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: molecule-reports
          path: test-results/
