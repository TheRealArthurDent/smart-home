# Home Assistant, running next to ioBroker until the last automation has moved (#2).
# Mounted read-only: integrations are set up in the UI and live in the volume (.storage); automations, scripts,
# helpers and templates are written as packages in packages/ and rolled out by the smart_home role.
# Location and coordinates are set during onboarding and stay out of this repo.

default_config:

homeassistant:
  name: Home
  time_zone: Europe/Berlin
  country: DE
  unit_system: metric
  temperature_unit: C
  currency: EUR
  # One file per topic (presence, shutters, ...), each with its automations, scripts and helpers
  packages: !include_dir_named packages

# Sandbox for prototypes made in the UI or through the MCP server, kept in the volume, not in the repo. What works
# moves into a package; then its prototype is deleted. The smart_home role creates the files empty.
automation sandbox: !include automations.yaml
script sandbox: !include scripts.yaml
scene sandbox: !include scenes.yaml

# No http: here. Home Assistant keeps it in .storage/http and imports YAML only once, as a trial an admin must
# confirm in the UI. The smart_home role seeds that store with the reverse proxy settings instead
# (smart_home_homeassistant_http_store).
