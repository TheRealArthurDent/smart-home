# Presence and evening, replacing Node-RED's "Presence detection" and "Evening detection" (#2).
# Which phones belong to whom is set in the app (Settings > People): each person gets the device tracker of their
# phone from the FRITZ!Box integration, and zone.home counts the people at home. No device names or addresses here.

template:
  - binary_sensor:
      - name: Jemand zu Hause
        unique_id: someone_home
        default_entity_id: binary_sensor.someone_home
        device_class: presence
        state: "{{ states('zone.home') | int(0) > 0 }}"
        # Arriving counts at once; leaving only after five minutes, so a phone briefly dropping off Wi-Fi is ignored
        delay_off:
          minutes: 5

automation:
  - id: evening_starts
    alias: Abend beginnt
    description: Im Winter 15 Minuten vor Sonnenuntergang, im Sommer 19 Minuten vor der bürgerlichen Dämmerung.
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
        id: winter
      - trigger: template
        value_template: >-
          {% set dusk = state_attr('sun.sun', 'next_dusk') | as_datetime(none) %}
          {{ now().dst() and dusk is not none and now() >= dusk - timedelta(minutes=19) }}
        id: summer
    conditions:
      - condition: template
        value_template: "{{ trigger.id == 'summer' or not now().dst() }}"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.evening

  - id: evening_ends
    alias: Abend endet
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.evening
