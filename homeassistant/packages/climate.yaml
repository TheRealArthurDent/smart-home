# Climate (#2): dew points, and the outside temperature on MQTT for the display next to the door, an ESP8266 reading
# climate/outside/temperature. ioBroker's mqtt-client published it the same way (retained, QoS 1), so the display
# gets the last value whenever it connects.

automation:
  - id: outside_temperature_to_mqtt
    alias: Außentemperatur fürs Display per MQTT senden
    description: Retained auf climate/outside/temperature, bei jeder Änderung und nach dem Start.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.garten_aussentemperatur2
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.garten_aussentemperatur2') | is_number }}"
    actions:
      - action: mqtt.publish
        data:
          topic: climate/outside/temperature
          payload: "{{ states('sensor.garten_aussentemperatur2') }}"
          qos: 1
          retain: true

# Dew points of every device measuring temperature and humidity, by the macro in custom_templates/climate.jinja.
# The LUMI sensors report humidity on the plain id and temperature on _2, the others the other way round.
template:
  - sensor:
      - name: Taupunkt Wohnzimmer
        unique_id: dew_point_living_room
        default_entity_id: sensor.dew_point_living_room
        device_class: temperature
        unit_of_measurement: °C
        state_class: measurement
        availability: >-
          {{ states('sensor.wohnzimmer_wohnzimmer_2') | is_number and
          states('sensor.wohnzimmer_wohnzimmer') | float(0) > 0 }}
        state: >-
          {% from 'climate.jinja' import dew_point -%}
          {{ dew_point('sensor.wohnzimmer_wohnzimmer_2', 'sensor.wohnzimmer_wohnzimmer') }}
      - name: Taupunkt Schlafzimmer
