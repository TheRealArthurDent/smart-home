# Shoe heating, replacing Node-RED's "Shoe ventilation" (#2).
# Plugging the plug in heats for the shoe heating duration, but not into night rest: if more than 20 minutes are
# left until then, it heats until night rest and the rest the next day from the weekend alarm time;
# otherwise all of it the next day. The timer and the rest survive restarts.

input_number:
  shoe_heating_rest:
    name: Schuhheizung, Rest für den nächsten Tag
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:shoe-formal

timer:
  shoe_heating:
    name: Schuhheizung
    restore: true

automation:
  - id: shoe_heating_start
    alias: Schuhheizung startet beim Einstecken
    mode: restart
    triggers:
      - trigger: state
        entity_id: switch.bad_on_off_schuhheizung
        from: unavailable
    actions:
      - variables:
          heating_seconds: "{{ (states('input_number.shoe_heating_duration') | float(0) * 3600) | int }}"
          # Negative once night rest has begun
          seconds_until_night_rest: >-
            {{ (today_at(states('input_datetime.night_rest')) - now()).total_seconds() | int }}
      - choose:
          - alias: Vor der Nachtruhe fertig, in einem Rutsch heizen
            conditions: "{{ heating_seconds <= seconds_until_night_rest }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.bad_on_off_schuhheizung
              - action: timer.start
                target:
                  entity_id: timer.shoe_heating
                data:
                  duration: "{{ heating_seconds }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.shoe_heating_rest
                data:
                  value: 0
          - alias: Mehr als 20 Minuten bis zur Nachtruhe, bis dahin heizen und den Rest am nächsten Tag
            conditions: "{{ seconds_until_night_rest > 20 * 60 }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.bad_on_off_schuhheizung
              - action: timer.start
                target:
                  entity_id: timer.shoe_heating
                data:
                  duration: "{{ seconds_until_night_rest }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.shoe_heating_rest
                data:
                  value: "{{ ((heating_seconds - seconds_until_night_rest) / 60) | round(0, 'ceil') }}"
        # Too late today: all of it the next day
        default:
          - action: timer.cancel
            target:
              entity_id: timer.shoe_heating
          - action: switch.turn_off
            target:
              entity_id: switch.bad_on_off_schuhheizung
          - action: input_number.set_value
            target:
              entity_id: input_number.shoe_heating_rest
            data:
              value: "{{ (heating_seconds / 60) | round(0, 'ceil') }}"

  - id: shoe_heating_next_day
    alias: Schuhheizung heizt am nächsten Tag zu Ende
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.wake_up_time_weekend
    conditions:
      - condition: numeric_state
        entity_id: input_number.shoe_heating_rest
        above: 0
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.bad_on_off_schuhheizung
      - action: timer.start
        target:
          entity_id: timer.shoe_heating
        data:
          duration: "{{ states('input_number.shoe_heating_rest') | int(0) * 60 }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.shoe_heating_rest
        data:
          value: 0

  - id: shoe_heating_off
    alias: Schuhheizung aus
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.shoe_heating
    actions:
      # Also when it was unplugged meanwhile
      - action: switch.turn_off
        target:
          entity_id: switch.bad_on_off_schuhheizung
        continue_on_error: true
