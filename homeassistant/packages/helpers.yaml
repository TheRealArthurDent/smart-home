# Helpers replacing the 0_userdata values of ioBroker and the states Node-RED kept in node-red.0 (#2).
# No initial: anywhere: Home Assistant restores a helper's last state, so what is set in the app survives restarts
# and deployments. The start values are set once, by the automation at the end.

input_boolean:
  wecker_werktag:
    name: Wake-up alarm on workdays
    icon: mdi:alarm
  wecker_wochenende:
    name: Wake-up alarm on weekends and holidays
    icon: mdi:alarm
  wecken_aussetzen:
    name: Skip the next wake-up
    icon: mdi:alarm-off
  gaeste:
    name: Guests present
    icon: mdi:account-multiple
  abend:
    name: Evening
    icon: mdi:weather-sunset
  rollladen_buero_sperre:
    name: Shutter office, no automatic moves
    icon: mdi:window-shutter-alert
  rollladen_kueche_sperre:
    name: Shutter kitchen, no automatic moves
    icon: mdi:window-shutter-alert
  rollladen_schlafzimmer_sperre:
    name: Shutter bedroom, no automatic moves
    icon: mdi:window-shutter-alert
  rollladen_garten_sperre:
    name: Shutter garden, no automatic moves
    icon: mdi:window-shutter-alert
  rollladen_terrasse_sperre:
    name: Shutter terrace, no automatic moves
    icon: mdi:window-shutter-alert
  helfer_startwerte_gesetzt:
    name: Helper start values set
    icon: mdi:check-circle-outline

input_datetime:
  weckzeit_werktag:
    name: Wake-up time on workdays
    has_date: false
    has_time: true
  weckzeit_wochenende:
    name: Wake-up time on weekends and holidays
    has_date: false
    has_time: true
  nachtruhe:
    name: Night rest from
    has_date: false
    has_time: true

input_number:
  dauer_schuhheizung:
    name: Shoe heating duration
    min: 0
    max: 24
    step: 0.5
    unit_of_measurement: h
    icon: mdi:shoe-formal
  rollladen_helligkeit:
    name: Heat protection brightness (with temperature)
    min: 0
    max: 100000
    step: 1000
    mode: box
    unit_of_measurement: lx
  rollladen_helligkeit_max:
    name: Heat protection brightness (alone)
    min: 0
    max: 100000
    step: 1000
    mode: box
    unit_of_measurement: lx
  rollladen_temperatur:
    name: Heat protection temperature (with brightness)
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: °C
  rollladen_temperatur_max:
    name: Heat protection temperature (alone)
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: °C
  rollladen_buero_soll:
    name: Shutter office, desired position
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  rollladen_kueche_soll:
    name: Shutter kitchen, desired position
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  rollladen_schlafzimmer_soll:
    name: Shutter bedroom, desired position
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  rollladen_garten_soll:
    name: Shutter garden, desired position
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  rollladen_terrasse_soll:
    name: Shutter terrace, desired position
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings

timer:
  aufwachlicht:
    name: Wake-up light dimming
    restore: true

automation:
  - id: helfer_startwerte
    alias: Fill the helpers with the start values from ioBroker
    description: Runs on the first start only; after that, what is set in the app applies.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.helfer_startwerte_gesetzt
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wecker_werktag
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wecker_wochenende
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.weckzeit_werktag
        data:
          time: "07:20:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.weckzeit_wochenende
        data:
          time: "10:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.nachtruhe
        data:
          time: "22:00:00"
      - action: input_number.set_value
        target:
          entity_id: input_number.dauer_schuhheizung
        data:
          value: 8
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_helligkeit
        data:
          value: 30000
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_helligkeit_max
        data:
          value: 35000
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_temperatur
        data:
          value: 23
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_temperatur_max
        data:
          value: 26
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_buero_soll
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_kueche_soll
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_schlafzimmer_soll
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_garten_soll
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.rollladen_terrasse_soll
        data:
          value: 100
      # Last, so a failed run is retried on the next start
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.helfer_startwerte_gesetzt
