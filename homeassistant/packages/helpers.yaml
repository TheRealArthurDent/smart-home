# Helpers replacing the 0_userdata values of ioBroker and the states Node-RED kept in node-red.0 (#2).
# No initial: anywhere: Home Assistant restores a helper's last state, so what is set in the app survives restarts
# and deployments. The start values are set once, by the automation at the end.

input_boolean:
  wake_up_workday:
    name: Wecker an Werktagen
    icon: mdi:alarm
  wake_up_weekend:
    name: Wecker am Wochenende und an Feiertagen
    icon: mdi:alarm
  skip_next_wake_up:
    name: Nächstes Wecken aussetzen
    icon: mdi:alarm-off
  guests:
    name: Gäste da
    icon: mdi:account-multiple
  evening:
    name: Abend
    icon: mdi:weather-sunset
  shutter_office_locked:
    name: Rollladen Büro nicht automatisch bewegen
    icon: mdi:window-shutter-alert
  shutter_kitchen_locked:
    name: Rollladen Küche nicht automatisch bewegen
    icon: mdi:window-shutter-alert
  shutter_bedroom_locked:
    name: Rollladen Schlafzimmer nicht automatisch bewegen
    icon: mdi:window-shutter-alert
  shutter_garden_locked:
    name: Rollladen Garten nicht automatisch bewegen
    icon: mdi:window-shutter-alert
  shutter_terrace_locked:
    name: Rollladen Terrasse nicht automatisch bewegen
    icon: mdi:window-shutter-alert
  helper_start_values_set:
    name: Startwerte der Helfer gesetzt
    icon: mdi:check-circle-outline

input_datetime:
  wake_up_time_workday:
    name: Weckzeit an Werktagen
    has_date: false
    has_time: true
  wake_up_time_weekend:
    name: Weckzeit am Wochenende und an Feiertagen
    has_date: false
    has_time: true
  night_rest:
    name: Nachtruhe ab
    has_date: false
    has_time: true

input_number:
  shoe_heating_duration:
    name: Dauer der Schuhheizung
    min: 0
    max: 24
    step: 0.5
    unit_of_measurement: h
    icon: mdi:shoe-formal
  shutter_brightness:
    name: Hitzeschutz Helligkeit (mit Temperatur)
    min: 0
    max: 100000
    step: 1000
    mode: box
    unit_of_measurement: lx
  shutter_brightness_max:
    name: Hitzeschutz Helligkeit (allein)
    min: 0
    max: 100000
    step: 1000
    mode: box
    unit_of_measurement: lx
  shutter_temperature:
    name: Hitzeschutz Temperatur (mit Helligkeit)
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: °C
  shutter_temperature_max:
    name: Hitzeschutz Temperatur (allein)
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: °C
  shutter_office_target:
    name: Rollladen Büro, Sollposition
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  shutter_kitchen_target:
    name: Rollladen Küche, Sollposition
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  shutter_bedroom_target:
    name: Rollladen Schlafzimmer, Sollposition
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  shutter_garden_target:
    name: Rollladen Garten, Sollposition
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings
  shutter_terrace_target:
    name: Rollladen Terrasse, Sollposition
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:window-shutter-settings

timer:
  wake_up_light:
    name: Aufwachlicht dimmt
    restore: true

automation:
  - id: helper_start_values
    alias: Helfer mit den Startwerten aus ioBroker füllen
    description: Läuft nur beim ersten Start; danach gilt, was in der App eingestellt ist.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.helper_start_values_set
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wake_up_workday
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wake_up_weekend
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.wake_up_time_workday
        data:
          time: "07:20:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.wake_up_time_weekend
        data:
          time: "10:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.night_rest
        data:
          time: "22:00:00"
      - action: input_number.set_value
        target:
          entity_id: input_number.shoe_heating_duration
        data:
          value: 8
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_brightness
        data:
          value: 30000
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_brightness_max
        data:
          value: 35000
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_temperature
        data:
          value: 23
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_temperature_max
        data:
          value: 26
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_office_target
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_kitchen_target
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_bedroom_target
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_garden_target
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: input_number.shutter_terrace_target
        data:
          value: 100
      # Last, so a failed run is retried on the next start
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.helper_start_values_set
