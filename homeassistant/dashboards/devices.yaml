# Device status, replacing Grafana's "Device status" dashboard (#2) with built-in cards only. A section view: the
# counts from packages/devices.yaml with their history, then a tile for each device that is unreachable or whose
# battery runs low (shown only then), the Shellies' warnings and all batteries. The counts cover every deCONZ, Shelly
# and Sonos device, so a new device that is missing here still shows up in them; add its tile then.
# Grafana's device temperature is left out: the Shellies' temperature entities are disabled; their overheating and
# overload sensors are the warnings.
title: Geräte
views:
  - title: Status
    path: status
    icon: mdi:devices
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Überblick
            icon: mdi:devices
