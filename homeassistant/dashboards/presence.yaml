# Presence dashboard (#2): who is home, which trackers count for whom, and how presence changed. People and their
# trackers are read from the states (assigned in Settings > People), so no names or device ids are in this repo.
title: Presence
views:
  - title: Presence
    path: presence
    icon: mdi:home-account
    cards:
      - type: entities
        title: Now
        entities:
          - entity: binary_sensor.jemand_zuhause
            name: Someone home (off 5 min after the last one left)
          - entity: zone.home
            name: People in the home zone
          - entity: input_boolean.abend
            name: Evening
          - entity: input_boolean.gaeste
            name: Guests present

      - type: markdown
        title: People and their trackers
        content: >-
          {% for someone in states.person | sort(attribute='name') %}

          **{{ someone.name }}**: {{ someone.state }}, since {{ relative_time(someone.last_changed) }}
          (source: {{ someone.attributes.source or 'none' }})

          {% for tracker in someone.attributes.device_trackers | default([]) %}
          - {{ state_attr(tracker, 'friendly_name') or tracker }}: {{ states(tracker) }},
          IP {{ state_attr(tracker, 'ip') or '-' }}, since {{ relative_time(states[tracker].last_changed)
          if states[tracker] else '-' }}
          {% else %}
          - no tracker assigned
          {% endfor %}
          {% else %}
          No people yet.
          {% endfor %}


          {{ states.device_tracker | list | count }} device trackers known,
          {{ states.device_tracker | selectattr('state', 'eq', 'home') | list | count }} of them home.

      - type: history-graph
        title: Last 48 hours
        hours_to_show: 48
        entities:
          - entity: binary_sensor.jemand_zuhause
          - entity: zone.home
          - entity: input_boolean.abend

      - type: logbook
        title: Changes
        hours_to_show: 48
        target:
          entity_id:
            - binary_sensor.jemand_zuhause
            - zone.home
