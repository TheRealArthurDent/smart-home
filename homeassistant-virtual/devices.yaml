# Virtual twins of the devices the packages use, for testbench only: it has neither the Zigbee stick nor the Shellies
# of raspi (#2). The smart_home role copies this directory to hosts with smart_home_homeassistant_virtual_devices
# and keeps it empty everywhere else; packages/virtual_devices.yaml includes it.
#
# Each twin has the entity id of the real device and keeps its state in a helper (virtual_<object id>), so an
# automation switching it changes a state that can be read back, and that survives a restart. Sensors are switched
# by hand through their helper, a shutter through its position helper, a plug's plugging in through its
# plugged_in helper. Buttons have no state: the script virtual_button_press fires their deconz_event.
# tests/test_homeassistant.py fails when a package uses a device without a twin here.

input_boolean:
  virtual_wohnzimmer_dekolights:
    name: DekoLights (virtuell)
  virtual_wohnzimmer_weihnachtssterne:
    name: Weihnachtssterne (virtuell)
  virtual_schlafzimmer_aufwachlicht:
    name: Aufwachlicht (virtuell)
  virtual_buro_eckschreibtisch:
    name: Eckschreibtisch (virtuell)
  virtual_abstellkammer_light_storeroom_output_0:
    name: Licht Abstellkammer (virtuell)
  virtual_buro_on_off_homeoffice:
    name: Homeoffice (virtuell)
  virtual_bad_on_off_schuhheizung:
    name: Schuhheizung (virtuell)
  virtual_bad_on_off_schuhheizung_plugged_in:
    name: Schuhheizung eingesteckt (virtuell)
    icon: mdi:power-plug
  virtual_abstellkammer_bewegung_abstellkammer:
    name: Bewegung Abstellkammer (virtuell)
    icon: mdi:gesture-tap
  virtual_schlafzimmer_light_bedroom_eingang_0:
    name: Wandschalter Schlafzimmer (virtuell)
    icon: mdi:gesture-tap
  virtual_wohnzimmer_openclose_terrace:
    name: Terrassentür offen (virtuell)
    icon: mdi:door-open

input_number:
  virtual_schlafzimmer_shutter_bedroom_position:
    name: Rollladen Schlafzimmer, Position (virtuell)
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  virtual_buro_shutter_office_position:
    name: Rollladen Büro, Position (virtuell)
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  virtual_kuche_shutter_kitchen_position:
    name: Rollladen Küche, Position (virtuell)
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  virtual_wohnzimmer_shutter_garden_position:
    name: Rollladen Garten, Position (virtuell)
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  virtual_wohnzimmer_shutter_terrace_position:
    name: Rollladen Terrasse, Position (virtuell)
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  virtual_wohnzimmer_dekolights_brightness:
    name: DekoLights, Helligkeit (virtuell)
    min: 1
    max: 255
    step: 1
    mode: box
  virtual_wohnzimmer_weihnachtssterne_brightness:
    name: Weihnachtssterne, Helligkeit (virtuell)
    min: 1
    max: 255
    step: 1
    mode: box
  virtual_schlafzimmer_aufwachlicht_brightness:
    name: Aufwachlicht, Helligkeit (virtuell)
    min: 1
    max: 255
    step: 1
    mode: box
  virtual_buro_eckschreibtisch_brightness:
    name: Eckschreibtisch, Helligkeit (virtuell)
    min: 1
    max: 255
    step: 1
    mode: box

template:
  - light:
      - name: DekoLights
        unique_id: virtual_wohnzimmer_dekolights
        default_entity_id: light.wohnzimmer_dekolights
        state: "{{ is_state('input_boolean.virtual_wohnzimmer_dekolights', 'on') }}"
        level: "{{ states('input_number.virtual_wohnzimmer_dekolights_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_wohnzimmer_dekolights
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_wohnzimmer_dekolights
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_dekolights_brightness
            data:
              value: "{{ [brightness | int(255), 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_wohnzimmer_dekolights
      - name: Weihnachtssterne
        unique_id: virtual_wohnzimmer_weihnachtssterne
        default_entity_id: light.wohnzimmer_weihnachtssterne
        state: "{{ is_state('input_boolean.virtual_wohnzimmer_weihnachtssterne', 'on') }}"
        level: "{{ states('input_number.virtual_wohnzimmer_weihnachtssterne_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_wohnzimmer_weihnachtssterne
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_wohnzimmer_weihnachtssterne
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_weihnachtssterne_brightness
            data:
              value: "{{ [brightness | int(255), 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_wohnzimmer_weihnachtssterne
      - name: Aufwachlicht
        unique_id: virtual_schlafzimmer_aufwachlicht
        default_entity_id: light.schlafzimmer_aufwachlicht
        state: "{{ is_state('input_boolean.virtual_schlafzimmer_aufwachlicht', 'on') }}"
        level: "{{ states('input_number.virtual_schlafzimmer_aufwachlicht_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_schlafzimmer_aufwachlicht
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_schlafzimmer_aufwachlicht
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_schlafzimmer_aufwachlicht_brightness
            data:
              value: "{{ [brightness | int(255), 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_schlafzimmer_aufwachlicht
      - name: Eckschreibtisch
        unique_id: virtual_buro_eckschreibtisch
        default_entity_id: light.buro_eckschreibtisch
        state: "{{ is_state('input_boolean.virtual_buro_eckschreibtisch', 'on') }}"
        level: "{{ states('input_number.virtual_buro_eckschreibtisch_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_buro_eckschreibtisch
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_buro_eckschreibtisch
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_buro_eckschreibtisch_brightness
            data:
              value: "{{ [brightness | int(255), 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_buro_eckschreibtisch
  - switch:
      - name: Licht Abstellkammer
        unique_id: virtual_abstellkammer_light_storeroom_output_0
        default_entity_id: switch.abstellkammer_light_storeroom_output_0
        state: "{{ is_state('input_boolean.virtual_abstellkammer_light_storeroom_output_0', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_abstellkammer_light_storeroom_output_0
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_abstellkammer_light_storeroom_output_0
      - name: Homeoffice
        unique_id: virtual_buro_on_off_homeoffice
        default_entity_id: switch.buro_on_off_homeoffice
        state: "{{ is_state('input_boolean.virtual_buro_on_off_homeoffice', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_buro_on_off_homeoffice
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_buro_on_off_homeoffice
      - name: Schuhheizung
        unique_id: virtual_bad_on_off_schuhheizung
        default_entity_id: switch.bad_on_off_schuhheizung
        # Unavailable while unplugged, like the real plug
        availability: "{{ is_state('input_boolean.virtual_bad_on_off_schuhheizung_plugged_in', 'on') }}"
        state: "{{ is_state('input_boolean.virtual_bad_on_off_schuhheizung', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_bad_on_off_schuhheizung
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_bad_on_off_schuhheizung
  - cover:
      - name: Rollladen Schlafzimmer
        unique_id: virtual_schlafzimmer_shutter_bedroom
        default_entity_id: cover.schlafzimmer_shutter_bedroom
        device_class: shutter
        # Moves at once; 100 is open, as with the Shellies
        position: "{{ states('input_number.virtual_schlafzimmer_shutter_bedroom_position') | int(0) }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_schlafzimmer_shutter_bedroom_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_schlafzimmer_shutter_bedroom_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_schlafzimmer_shutter_bedroom_position
            data:
              value: "{{ position }}"
      - name: Rollladen Büro
        unique_id: virtual_buro_shutter_office
        default_entity_id: cover.buro_shutter_office
        device_class: shutter
        position: "{{ states('input_number.virtual_buro_shutter_office_position') | int(0) }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_buro_shutter_office_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_buro_shutter_office_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_buro_shutter_office_position
            data:
              value: "{{ position }}"
      - name: Rollladen Küche
        unique_id: virtual_kuche_shutter_kitchen
        default_entity_id: cover.kuche_shutter_kitchen
        device_class: shutter
        position: "{{ states('input_number.virtual_kuche_shutter_kitchen_position') | int(0) }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_kuche_shutter_kitchen_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_kuche_shutter_kitchen_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_kuche_shutter_kitchen_position
            data:
              value: "{{ position }}"
      - name: Rollladen Garten
        unique_id: virtual_wohnzimmer_shutter_garden
        default_entity_id: cover.wohnzimmer_shutter_garden
        device_class: shutter
        position: "{{ states('input_number.virtual_wohnzimmer_shutter_garden_position') | int(0) }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_shutter_garden_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_shutter_garden_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_shutter_garden_position
            data:
              value: "{{ position }}"
      - name: Rollladen Terrasse
        unique_id: virtual_wohnzimmer_shutter_terrace
        default_entity_id: cover.wohnzimmer_shutter_terrace
        device_class: shutter
        position: "{{ states('input_number.virtual_wohnzimmer_shutter_terrace_position') | int(0) }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_shutter_terrace_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_shutter_terrace_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_shutter_terrace_position
            data:
              value: "{{ position }}"
  - binary_sensor:
      - name: Bewegung Abstellkammer
        unique_id: virtual_abstellkammer_bewegung_abstellkammer
        default_entity_id: binary_sensor.abstellkammer_bewegung_abstellkammer
        state: "{{ is_state('input_boolean.virtual_abstellkammer_bewegung_abstellkammer', 'on') }}"
        device_class: motion
      - name: Wandschalter Schlafzimmer
        unique_id: virtual_schlafzimmer_light_bedroom_eingang_0
        default_entity_id: binary_sensor.schlafzimmer_light_bedroom_eingang_0
        state: "{{ is_state('input_boolean.virtual_schlafzimmer_light_bedroom_eingang_0', 'on') }}"
      - name: Terrassentür
        unique_id: virtual_wohnzimmer_openclose_terrace
        default_entity_id: binary_sensor.wohnzimmer_openclose_terrace
        state: "{{ is_state('input_boolean.virtual_wohnzimmer_openclose_terrace', 'on') }}"
        device_class: door

script:
  virtual_button_press:
    alias: Virtuellen Taster drücken
    description: Löst das deconz_event eines deCONZ-Tasters aus, für die Automationen, die es per unique_id erkennen.
    mode: queued
    fields:
      unique_id:
        name: Taster
        description: unique_id des Tasters, wie im Auslöser der Automation
        required: true
        example: "5c:c7:c1:ff:fe:83:4b:a0"
        selector:
          text:
      event:
        name: Event-Code
        description: 1002 „an“ gedrückt, 2002 „aus“ gedrückt; x001 gehalten, x003 nach dem Halten losgelassen
        required: true
        default: 1002
        selector:
          number:
            min: 1000
            max: 9999
            mode: box
    sequence:
      - event: deconz_event
        event_data:
          unique_id: "{{ unique_id }}"
          event: "{{ event | int }}"
