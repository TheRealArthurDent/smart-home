# Virtual twins of the devices the packages use, for testbench only: it has neither the Zigbee stick nor the Shellies
# of raspi, and its Sonos twins keep it off the house's real speakers (#2). The smart_home role copies this directory
# to hosts with smart_home_homeassistant_virtual_devices and keeps it empty everywhere else;
# packages/virtual_devices.yaml includes it.
#
# Each twin has the entity id of the real device and keeps its state in a helper (virtual_<object id>), so an
# automation switching it changes a state that can be read back, and that survives a restart. Sensors are switched
# by hand through their helper (a measuring sensor through its input_number), a shutter through its position
# helper, a plug's plugging in through its plugged_in helper. Buttons have no state: the script
# virtual_button_press fires their deconz_event. A Sonos speaker plays while its helper is on and counts its
# skipped tracks in a second one.
# tests/test_homeassistant.py fails when a package uses a device without a twin here.

