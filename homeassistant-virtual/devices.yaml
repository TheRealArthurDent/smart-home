# The Sonos speakers; a universal player's entity id comes from its name (media_player.wohnzimmer_wohnzimmer)
media_player:
  - platform: universal
    name: Wohnzimmer Wohnzimmer
    unique_id: virtual_wohnzimmer_wohnzimmer
    children: []
    state_template: "{{ 'playing' if is_state('input_boolean.virtual_wohnzimmer_wohnzimmer', 'on') else 'idle' }}"
    commands:
      media_play:
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.virtual_wohnzimmer_wohnzimmer
      media_pause:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.virtual_wohnzimmer_wohnzimmer
      media_stop:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.virtual_wohnzimmer_wohnzimmer
      media_next_track:
        action: input_number.increment
        target:
          entity_id: input_number.virtual_wohnzimmer_wohnzimmer_track
  - platform: universal
    name: Büro Büro
    unique_id: virtual_buro_buro
    children: []
    state_template: "{{ 'playing' if is_state('input_boolean.virtual_buro_buro', 'on') else 'idle' }}"
    commands:
      media_play:
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.virtual_buro_buro
      media_pause:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.virtual_buro_buro
      media_stop:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.virtual_buro_buro
      media_next_track:
        action: input_number.increment
        target:
          entity_id: input_number.virtual_buro_buro_track
  - platform: universal
    name: Bad Bad
    unique_id: virtual_bad_bad
    children: []
    state_template: "{{ 'playing' if is_state('input_boolean.virtual_bad_bad', 'on') else 'idle' }}"
    commands:
      media_play:
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.virtual_bad_bad
      media_pause:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.virtual_bad_bad
      media_stop:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.virtual_bad_bad
      media_next_track:
        action: input_number.increment
        target:
          entity_id: input_number.virtual_bad_bad_track

template:
  - light:
      - name: DekoLights
        unique_id: virtual_wohnzimmer_dekolights
        default_entity_id: light.wohnzimmer_dekolights
        state: "{{ is_state('input_boolean.virtual_wohnzimmer_dekolights', 'on') }}"
        level: "{{ states('input_number.virtual_wohnzimmer_dekolights_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_wohnzimmer_dekolights
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.virtual_wohnzimmer_dekolights
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.virtual_wohnzimmer_dekolights_brightness
            data:
              value: "{{ [brightness | int(255), 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.virtual_wohnzimmer_dekolights
      - name: Weihnachtssterne
        unique_id: virtual_wohnzimmer_weihnachtssterne
        default_entity_id: light.wohnzimmer_weihnachtssterne
        state: "{{ is_state('input_boolean.virtual_wohnzimmer_weihnachtssterne', 'on') }}"
        level: "{{ states('input_number.virtual_wohnzimmer_weihnachtssterne_brightness') | int(255) }}"
