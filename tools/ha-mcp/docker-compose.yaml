# Home Assistant's MCP server (ha-mcp) for Claude Code, on the dev machine, not on the Pis (#2). One container per
# Home Assistant instance, serving streamable HTTP on loopback only; .mcp.json at the repo root points Claude Code at
# them. URLs, tokens and the path of the private root CA come from .env next to this file (git-ignored, keys in
# .env.example). See README.md.
#
#   docker compose up -d     # in this directory

x-ha-mcp: &ha-mcp
  image: ghcr.io/homeassistant-ai/ha-mcp:9.2.0
  command: ["ha-mcp-web"]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  ha-mcp-testbench:
    <<: *ha-mcp
    container_name: ha-mcp-testbench
    environment:
      HOMEASSISTANT_URL: ${HA_TESTBENCH_URL:?set HA_TESTBENCH_URL in .env}
      HOMEASSISTANT_TOKEN: ${HA_TESTBENCH_TOKEN:?set HA_TESTBENCH_TOKEN in .env}
      SSL_CERT_FILE: /etc/ha-mcp/root-ca.pem
    ports:
      - 127.0.0.1:8086:8086
    volumes:
      - ${HA_CA_FILE:?set HA_CA_FILE in .env}:/etc/ha-mcp/root-ca.pem:ro
      - ha-mcp-testbench:/home/mcpuser/.ha-mcp

  ha-mcp-raspi:
    <<: *ha-mcp
    container_name: ha-mcp-raspi
    environment:
      HOMEASSISTANT_URL: ${HA_RASPI_URL:?set HA_RASPI_URL in .env}
      HOMEASSISTANT_TOKEN: ${HA_RASPI_TOKEN:?set HA_RASPI_TOKEN in .env}
      SSL_CERT_FILE: /etc/ha-mcp/root-ca.pem
    ports:
      - 127.0.0.1:8087:8086
    volumes:
      - ${HA_CA_FILE:?set HA_CA_FILE in .env}:/etc/ha-mcp/root-ca.pem:ro
      - ha-mcp-raspi:/home/mcpuser/.ha-mcp

volumes:
  ha-mcp-testbench:
  ha-mcp-raspi:
